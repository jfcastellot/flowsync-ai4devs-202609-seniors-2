name: inspect-old-s5

on:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public S5 reference PRs
        run: |
          set -euo pipefail
          base="LIDR-academy/full-stack-adonisjs-s5-base-202606-sr-2"
          for pr in 15 12 25 10 26
          do
            echo "===== PR $pr META ====="
            curl -L -sS -H 'Accept: application/vnd.github+json' -H 'User-Agent: module5-reference' "https://api.github.com/repos/$base/pulls/$pr" > "/tmp/pr-$pr.json"
            jq '{title, body, html_url, user: .user.login, head_label: .head.label, head_ref: .head.ref, head_repo: .head.repo.full_name}' "/tmp/pr-$pr.json"
            echo "===== PR $pr FILES ====="
            curl -L -sS -H 'Accept: application/vnd.github+json' -H 'User-Agent: module5-reference' "https://api.github.com/repos/$base/pulls/$pr/files?per_page=100" > "/tmp/files-$pr.json"
            jq -r '.[] | [.filename,.status,.additions,.deletions] | @tsv' "/tmp/files-$pr.json"
            echo "===== PR $pr PATCHES ====="
            jq -r '.[] | select(.patch != null) | "### " + .filename + "\n" + .patch' "/tmp/files-$pr.json" | head -c 60000
            echo
          done
