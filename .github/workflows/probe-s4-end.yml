name: list-upstream-branches

on:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List public branches
        run: |
          set -u
          for r in             LIDR-academy/flowsync-ai4devs-202609-seniors-2             LIDR-academy/flowsync-ai4devs             LIDR-academy/flowsync-ai4devs-202609-seniors-1
          do
            echo "===== $r repository ====="
            curl -L -sS -H 'Accept: application/vnd.github+json' -H 'User-Agent: module5-probe'               "https://api.github.com/repos/$r" | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ["full_name","private","visibility","pushed_at","default_branch","message"]})' || true
            echo "===== $r branches ====="
            curl -L -sS -H 'Accept: application/vnd.github+json' -H 'User-Agent: module5-probe'               "https://api.github.com/repos/$r/branches?per_page=100" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d if isinstance(d,dict) else [x.get("name") for x in d])' || true
          done
